<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="400" height="280" fill="#1a1a2e" rx="12"/>
  <text x="200" y="22" text-anchor="middle" fill="#FF6B2B" font-size="13" font-weight="bold">DESTILACIÓN SOLAR — AGUA PURA SIN INSUMOS</text>

  <!-- Sol -->
  <circle cx="340" cy="55" r="28" fill="#FFD700" opacity="0.85"/>
  <circle cx="340" cy="55" r="20" fill="#FFE566"/>
  <!-- Rayos del sol -->
  <line x1="340" y1="18" x2="340" y2="10" stroke="#FFD700" stroke-width="2.5"/>
  <line x1="365" y1="30" x2="372" y2="23" stroke="#FFD700" stroke-width="2.5"/>
  <line x1="378" y1="55" x2="387" y2="55" stroke="#FFD700" stroke-width="2.5"/>
  <line x1="365" y1="80" x2="372" y2="87" stroke="#FFD700" stroke-width="2.5"/>
  <line x1="315" y1="30" x2="308" y2="23" stroke="#FFD700" stroke-width="2.5"/>
  <line x1="302" y1="55" x2="293" y2="55" stroke="#FFD700" stroke-width="2.5"/>

  <!-- Rayos de calor hacia el recipiente -->
  <line x1="320" y1="70" x2="250" y2="120" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.6" marker-end="url(#sr)"/>
  <line x1="310" y1="75" x2="220" y2="140" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.4" marker-end="url(#sr)"/>
  <defs>
    <marker id="sr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#FFD700" opacity="0.6"/>
    </marker>
    <marker id="ba" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4af"/>
    </marker>
  </defs>

  <!-- Recipiente GRANDE (balde/tina) -->
  <!-- Cuerpo -->
  <path d="M60 145 L60 230 Q60 240 70 240 L230 240 Q240 240 240 230 L240 145 Z" fill="#1a3a5a" stroke="#2a6aaa" stroke-width="2"/>
  <!-- Agua sucia/salada -->
  <path d="M60 190 L60 230 Q60 240 70 240 L230 240 Q240 240 240 230 L240 190 Z" fill="#2a4a2a" opacity="0.6"/>
  <text x="150" y="222" text-anchor="middle" fill="#4a8a4a" font-size="10">agua sucia / salada</text>

  <!-- Plástico transparente encima (cubierta) -->
  <path d="M55 145 Q150 110 245 145" stroke="#88ccff" stroke-width="2.5" fill="none" opacity="0.8"/>
  <path d="M55 145 L55 150 Q150 115 245 150 L245 145" fill="#88ccff" opacity="0.15"/>
  <!-- Texto plástico -->
  <text x="150" y="132" text-anchor="middle" fill="#88ccff" font-size="9" font-weight="bold">film transparente / bolsa plástica</text>
  <text x="150" y="143" text-anchor="middle" fill="#88ccff" font-size="8">sellado en los bordes con peso</text>

  <!-- Peso en el centro del plástico -->
  <ellipse cx="148" cy="155" rx="10" ry="6" fill="#888" stroke="#666" stroke-width="1"/>
  <text x="148" y="159" text-anchor="middle" fill="#eee" font-size="7">piedra</text>

  <!-- RECIPIENTE PEQUEÑO en el centro (recibe el agua destilada) -->
  <rect x="118" y="195" width="62" height="42" rx="6" fill="#1a2a3a" stroke="#4af" stroke-width="2"/>
  <!-- Agua destilada acumulada -->
  <rect x="118" y="218" width="62" height="19" rx="3" fill="#1a6aaa" opacity="0.7"/>
  <text x="149" y="232" text-anchor="middle" fill="#88ccff" font-size="8">agua pura</text>

  <!-- Flechas de proceso -->
  <!-- Vapor sube -->
  <path d="M100 190 Q90 175 105 165" stroke="#88ffff" stroke-width="1.5" fill="none" marker-end="url(#ba)" opacity="0.7"/>
  <path d="M200 188 Q215 172 198 162" stroke="#88ffff" stroke-width="1.5" fill="none" marker-end="url(#ba)" opacity="0.7"/>
  <text x="70" y="175" fill="#88ffff" font-size="8" opacity="0.8">vapor</text>
  <text x="70" y="185" fill="#88ffff" font-size="8" opacity="0.8">sube ↑</text>

  <!-- Condensación y goteo -->
  <path d="M148 155 L148 195" stroke="#4af" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#ba)"/>
  <text x="160" y="175" fill="#4af" font-size="8">condensa</text>
  <text x="160" y="185" fill="#4af" font-size="8">y gotea ↓</text>

  <!-- Producción -->
  <rect x="255" y="145" width="130" height="90" rx="8" fill="#111128"/>
  <text x="320" y="162" text-anchor="middle" fill="#FF6B2B" font-size="9" font-weight="bold">PRODUCCIÓN</text>
  <text x="320" y="177" text-anchor="middle" fill="#eee" font-size="9">0.5 - 1 litro/día</text>
  <text x="320" y="191" text-anchor="middle" fill="#eee" font-size="9">con sol directo</text>
  <line x1="265" y1="200" x2="375" y2="200" stroke="#333" stroke-width="1"/>
  <text x="320" y="214" text-anchor="middle" fill="#30D158" font-size="9" font-weight="bold">✓ Elimina:</text>
  <text x="320" y="226" text-anchor="middle" fill="#30D158" font-size="8">metales · sal · químicos</text>
  <text x="320" y="238" text-anchor="middle" fill="#FF6B2B" font-size="8">⏱ 4-6 horas de sol</text>

  <!-- Etiqueta recipiente grande -->
  <text x="40" y="142" fill="#2a6aaa" font-size="9">balde</text>
  <text x="40" y="153" fill="#2a6aaa" font-size="9">o tina</text>
  <!-- Etiqueta recipiente chico -->
  <text x="85" y="205" fill="#4af" font-size="8">taza o</text>
  <text x="85" y="215" fill="#4af" font-size="8">bol</text>
</svg>
