<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="400" height="280" fill="#0a0a1a" rx="12"/>
  <text x="200" y="22" text-anchor="middle" fill="#FF6B2B" font-size="13" font-weight="bold">ORIENTACIÓN — CRUZ DEL SUR (hemisferio sur)</text>

  <!-- Cielo estrellado fondo -->
  <circle cx="50" cy="50" r="1" fill="white" opacity="0.3"/>
  <circle cx="80" cy="35" r="1" fill="white" opacity="0.2"/>
  <circle cx="120" cy="45" r="1" fill="white" opacity="0.3"/>
  <circle cx="300" cy="40" r="1" fill="white" opacity="0.2"/>
  <circle cx="340" cy="55" r="1" fill="white" opacity="0.3"/>
  <circle cx="370" cy="35" r="1" fill="white" opacity="0.2"/>
  <circle cx="30" cy="100" r="1" fill="white" opacity="0.2"/>
  <circle cx="380" cy="90" r="1" fill="white" opacity="0.3"/>

  <!-- CRUZ DEL SUR (Crux) -->
  <!-- Estrellas de la cruz -->
  <!-- Gacrux (superior) -->
  <circle cx="185" cy="55" r="5" fill="#FFE066" filter="url(#glow)"/>
  <!-- Acrux (inferior - el más brillante) -->
  <circle cx="185" cy="120" r="7" fill="#FFE066" filter="url(#glow)"/>
  <!-- Delta Crucis (izquierda) -->
  <circle cx="148" cy="88" r="4" fill="#FFE066" filter="url(#glow)"/>
  <!-- Becrux (derecha) -->
  <circle cx="222" cy="88" r="5" fill="#FFE066" filter="url(#glow)"/>
  <!-- Estrella pequeña extra -->
  <circle cx="210" cy="68" r="2.5" fill="#FFE066" opacity="0.7"/>

  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Líneas de la cruz -->
  <line x1="185" y1="55" x2="185" y2="120" stroke="#FFE066" stroke-width="1.5" opacity="0.5"/>
  <line x1="148" y1="88" x2="222" y2="88" stroke="#FFE066" stroke-width="1.5" opacity="0.5"/>

  <!-- Etiquetas estrellas -->
  <text x="195" y="53" fill="#FFE066" font-size="8">Gacrux</text>
  <text x="195" y="125" fill="#FFE066" font-size="8">Acrux ★</text>
  <text x="100" y="91" fill="#FFE066" font-size="8">δ Crucis</text>
  <text x="228" y="91" fill="#FFE066" font-size="8">Becrux</text>

  <!-- Eje largo extendido (4.5 veces) -->
  <line x1="185" y1="120" x2="185" y2="235" stroke="#FF6B2B" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="195" y="145" fill="#FF6B2B" font-size="9">× 4.5</text>
  <text x="195" y="158" fill="#FF6B2B" font-size="9">el eje</text>
  <text x="195" y="170" fill="#FF6B2B" font-size="9">largo</text>

  <!-- Horizonte -->
  <line x1="20" y1="235" x2="380" y2="235" stroke="#444" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="30" y="248" fill="#666" font-size="9">horizonte</text>

  <!-- Punto SUR en horizonte -->
  <circle cx="185" cy="235" r="8" fill="#FF6B2B"/>
  <text x="185" y="239" text-anchor="middle" fill="white" font-size="9" font-weight="bold">S</text>
  <text x="185" y="255" text-anchor="middle" fill="#FF6B2B" font-size="11" font-weight="bold">SUR ↓</text>

  <!-- Puntos cardinales derivados -->
  <text x="30" y="255" fill="#aaa" font-size="11" font-weight="bold">E</text>
  <text x="355" y="255" fill="#aaa" font-size="11" font-weight="bold">O</text>
  <text x="185" y="40" text-anchor="middle" fill="#aaa" font-size="10">Norte (detrás)</text>

  <!-- Pointers (dos estrellas que apuntan al Crux) -->
  <circle cx="295" cy="75" r="4" fill="#88ccff" opacity="0.8"/>
  <circle cx="315" cy="95" r="4" fill="#88ccff" opacity="0.8"/>
  <line x1="295" y1="75" x2="315" y2="95" stroke="#88ccff" stroke-width="1" opacity="0.5"/>
  <text x="330" y="82" fill="#88ccff" font-size="8">Pointers</text>
  <text x="330" y="92" fill="#88ccff" font-size="8">(α y β Cen)</text>
  <!-- Flecha pointer hacia cruz -->
  <line x1="295" y1="75" x2="210" y2="88" stroke="#88ccff" stroke-width="1" opacity="0.4" stroke-dasharray="3,3"/>

  <!-- Método del palo (esquina inferior izquierda) -->
  <rect x="20" y="155" width="145" height="75" rx="8" fill="#111128" stroke="#444" stroke-width="1"/>
  <text x="92" y="170" text-anchor="middle" fill="#FF6B2B" font-size="9" font-weight="bold">MÉTODO DEL PALO (de día)</text>
  <!-- Palo vertical -->
  <line x1="60" y1="185" x2="60" y2="218" stroke="#8b6b3a" stroke-width="3"/>
  <!-- Sombra 1 -->
  <line x1="60" y1="185" x2="40" y2="192" stroke="#aaa" stroke-width="2"/>
  <circle cx="40" cy="192" r="3" fill="#FF6B2B"/>
  <text x="28" y="200" fill="#FF6B2B" font-size="8">①</text>
  <!-- Sombra 2 (20 min después) -->
  <line x1="60" y1="185" x2="82" y2="190" stroke="#aaa" stroke-width="2" stroke-dasharray="3,2"/>
  <circle cx="82" cy="190" r="3" fill="#30D158"/>
  <text x="85" y="198" fill="#30D158" font-size="8">② +20min</text>
  <!-- Línea O→E -->
  <line x1="35" y1="192" x2="85" y2="190" stroke="#4af" stroke-width="1.5"/>
  <text x="35" y="208" fill="#4af" font-size="8">①→② = Oeste→Este</text>
  <text x="35" y="220" fill="#aaa" font-size="8">perpendicular = Norte/Sur</text>
</svg>
