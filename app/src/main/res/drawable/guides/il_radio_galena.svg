<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="400" height="280" fill="#1a1a2e" rx="12"/>
  <text x="200" y="22" text-anchor="middle" fill="#FF6B2B" font-size="13" font-weight="bold">RADIO GALENA CASERA — DIAGRAMA</text>

  <!-- ANTENA (cable largo horizontal) -->
  <line x1="20" y1="60" x2="200" y2="60" stroke="#FFD700" stroke-width="2.5"/>
  <text x="110" y="52" text-anchor="middle" fill="#FFD700" font-size="10" font-weight="bold">ANTENA (cable 10-20m)</text>
  <text x="110" y="72" text-anchor="middle" fill="#cc9900" font-size="9">cable TV coaxial · hilo de cobre</text>

  <!-- Conexión antena al circuito -->
  <line x1="200" y1="60" x2="200" y2="100" stroke="#FFD700" stroke-width="2"/>

  <!-- BOBINA / SINTONIZADOR -->
  <rect x="155" y="100" width="90" height="50" rx="8" fill="#1e3a1e" stroke="#30D158" stroke-width="2"/>
  <text x="200" y="118" text-anchor="middle" fill="#30D158" font-size="10" font-weight="bold">BOBINA</text>
  <!-- Espiras de la bobina -->
  <path d="M165 130 Q172 123 180 130 Q187 137 195 130 Q202 123 210 130 Q217 137 225 130 Q232 123 235 130" stroke="#30D158" stroke-width="2" fill="none"/>
  <text x="200" y="143" text-anchor="middle" fill="#30D158" font-size="8">100 vueltas hilo de cobre</text>

  <!-- Conexión bobina al capacitor -->
  <line x1="155" y1="125" x2="100" y2="125" stroke="#aaa" stroke-width="1.5"/>
  <line x1="245" y1="125" x2="300" y2="125" stroke="#aaa" stroke-width="1.5"/>

  <!-- CAPACITOR VARIABLE -->
  <rect x="60" y="108" width="40" height="34" rx="6" fill="#1a2a3a" stroke="#4af" stroke-width="2"/>
  <text x="80" y="122" text-anchor="middle" fill="#4af" font-size="8" font-weight="bold">CAP.</text>
  <text x="80" y="133" text-anchor="middle" fill="#4af" font-size="8">365pF</text>
  <!-- Símbolo capacitor -->
  <line x1="70" y1="140" x2="90" y2="140" stroke="#4af" stroke-width="1.5"/>
  <text x="80" y="152" text-anchor="middle" fill="#4af" font-size="8">sintonía</text>

  <!-- DIODO DE GERMANIO -->
  <rect x="262" y="108" width="45" height="34" rx="6" fill="#3a1a1a" stroke="#ff6644" stroke-width="2"/>
  <text x="284" y="121" text-anchor="middle" fill="#ff6644" font-size="8" font-weight="bold">DIODO</text>
  <text x="284" y="131" text-anchor="middle" fill="#ff6644" font-size="8">germanio</text>
  <text x="284" y="141" text-anchor="middle" fill="#ff6644" font-size="8">OA90</text>

  <!-- AURICULARES -->
  <ellipse cx="320" cy="195" rx="22" ry="22" fill="#1e1e3a" stroke="#cc88ff" stroke-width="2"/>
  <ellipse cx="320" cy="195" rx="13" ry="13" fill="#2a2a4a" stroke="#cc88ff" stroke-width="1.5"/>
  <text x="320" y="199" text-anchor="middle" fill="#cc88ff" font-size="9" font-weight="bold">🎧</text>
  <text x="320" y="227" text-anchor="middle" fill="#cc88ff" font-size="9">AURICULARES</text>
  <text x="320" y="238" text-anchor="middle" fill="#8866aa" font-size="8">alta impedancia</text>

  <!-- Conexión diodo a auriculares -->
  <line x1="307" y1="125" x2="320" y2="173" stroke="#cc88ff" stroke-width="1.5"/>

  <!-- TIERRA -->
  <line x1="80" y1="142" x2="80" y2="220" stroke="#888" stroke-width="1.5"/>
  <line x1="60" y1="220" x2="100" y2="220" stroke="#888" stroke-width="2"/>
  <line x1="65" y1="226" x2="95" y2="226" stroke="#888" stroke-width="1.5"/>
  <line x1="70" y1="232" x2="90" y2="232" stroke="#888" stroke-width="1"/>
  <text x="80" y="248" text-anchor="middle" fill="#888" font-size="9">TIERRA</text>
  <text x="80" y="258" text-anchor="middle" fill="#666" font-size="8">caño agua·clavo en tierra</text>

  <!-- Conexión tierra a auriculares -->
  <line x1="100" y1="220" x2="320" y2="220" stroke="#888" stroke-width="1.5"/>
  <line x1="320" y1="220" x2="320" y2="217" stroke="#888" stroke-width="1.5"/>

  <!-- Señal de radio llegando -->
  <path d="M25 80 Q15 70 25 60" stroke="#FFD700" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M15 85 Q0 70 15 55" stroke="#FFD700" stroke-width="1.5" fill="none" opacity="0.4"/>
  <text x="22" y="95" fill="#FFD700" font-size="8" opacity="0.8">AM 870</text>

  <!-- Nota sin pilas -->
  <rect x="130" y="222" width="130" height="24" rx="6" fill="#1a2a00" stroke="#30D158" stroke-width="1"/>
  <text x="195" y="235" text-anchor="middle" fill="#30D158" font-size="9" font-weight="bold">✓ No necesita pilas</text>
  <text x="195" y="244" text-anchor="middle" fill="#30D158" font-size="8">funciona con energía de la señal</text>
</svg>
