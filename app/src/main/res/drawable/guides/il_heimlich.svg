<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="400" height="280" fill="#1a1a2e" rx="12"/>
  <text x="200" y="24" text-anchor="middle" fill="#FF6B2B" font-size="13" font-weight="bold">HEIMLICH — MANIOBRA ANTI-ATRAGANTAMIENTO</text>

  <!-- Persona atragantada (de frente, vista lateral) -->
  <!-- Cuerpo -->
  <rect x="155" y="80" width="60" height="120" rx="20" fill="#2a2a4a" stroke="#444" stroke-width="1.5"/>
  <!-- Cabeza -->
  <ellipse cx="185" cy="65" rx="22" ry="25" fill="#3a3a5a" stroke="#444" stroke-width="1.5"/>
  <!-- Cara angustiada -->
  <ellipse cx="178" cy="58" rx="4" ry="5" fill="#2a2a4a"/>
  <ellipse cx="192" cy="58" rx="4" ry="5" fill="#2a2a4a"/>
  <path d="M178 74 Q185 70 192 74" stroke="#ff4444" stroke-width="2" fill="none"/>
  <!-- Manos en garganta (señal de atragantamiento) -->
  <ellipse cx="160" cy="75" rx="12" ry="8" fill="#c8a882" stroke="#906840" stroke-width="1" transform="rotate(-20 160 75)"/>
  <ellipse cx="210" cy="75" rx="12" ry="8" fill="#c8a882" stroke="#906840" stroke-width="1" transform="rotate(20 210 75)"/>

  <!-- Rescatista detrás -->
  <!-- Cuerpo rescatista -->
  <rect x="130" y="95" width="50" height="100" rx="15" fill="#1e3a5f" stroke="#2a5a8f" stroke-width="1.5"/>
  <rect x="220" y="95" width="50" height="100" rx="15" fill="#1e3a5f" stroke="#2a5a8f" stroke-width="1.5"/>
  <!-- Cabeza rescatista (detrás) -->
  <ellipse cx="185" cy="78" rx="18" ry="20" fill="#2a4a6f" stroke="#2a5a8f" stroke-width="1" opacity="0.6"/>

  <!-- Brazos del rescatista rodeando -->
  <!-- Brazo izquierdo -->
  <path d="M145 140 Q160 150 185 155" stroke="#c8a882" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Brazo derecho -->
  <path d="M225 140 Q210 150 185 155" stroke="#c8a882" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- Punto de compresión abdominal -->
  <circle cx="185" cy="145" r="14" fill="#FF6B2B" opacity="0.3"/>
  <circle cx="185" cy="145" r="8" fill="#FF6B2B"/>
  <text x="185" y="149" text-anchor="middle" fill="white" font-size="9" font-weight="bold">★</text>

  <!-- Puño -->
  <ellipse cx="185" cy="152" rx="15" ry="10" fill="#b89870" stroke="#906840" stroke-width="1.5"/>

  <!-- Flechas de dirección (adentro y arriba) -->
  <path d="M185 170 L185 148" stroke="#FF6B2B" stroke-width="2.5" marker-end="url(#arr2)"/>
  <path d="M200 165 L192 150" stroke="#FF6B2B" stroke-width="2" opacity="0.6" marker-end="url(#arr2)"/>
  <path d="M170 165 L178 150" stroke="#FF6B2B" stroke-width="2" opacity="0.6" marker-end="url(#arr2)"/>
  <defs>
    <marker id="arr2" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#FF6B2B"/>
    </marker>
  </defs>
  <text x="218" y="168" fill="#FF6B2B" font-size="10" font-weight="bold">Adentro</text>
  <text x="218" y="180" fill="#FF6B2B" font-size="10" font-weight="bold">y arriba ↗</text>

  <!-- Zona correcta -->
  <rect x="160" y="125" width="50" height="25" rx="5" fill="none" stroke="#FF6B2B" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="215" y="132" fill="#aaa" font-size="9">Ombligo</text>
  <text x="215" y="143" fill="#aaa" font-size="9">↔ Esternón</text>

  <!-- Instrucciones -->
  <rect x="20" y="210" width="360" height="58" rx="8" fill="#111128"/>
  <text x="30" y="228" fill="#FF6B2B" font-size="10" font-weight="bold">⚠️  NO puede toser ni respirar → ACTUÁ YA</text>
  <text x="30" y="243" fill="#eee" font-size="10">· Paráte DETRÁS · Puño entre ombligo y esternón</text>
  <text x="30" y="258" fill="#eee" font-size="10">· Comprimí hacia ADENTRO y ARRIBA repetidamente</text>
</svg>
