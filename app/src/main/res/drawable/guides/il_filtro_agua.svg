<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="400" height="280" fill="#1a1a2e" rx="12"/>
  <text x="200" y="22" text-anchor="middle" fill="#FF6B2B" font-size="13" font-weight="bold">FILTRO CASERO DE AGUA — CAPAS</text>

  <!-- Botella superior (embudo) -->
  <!-- Cuerpo botella invertida -->
  <path d="M130 40 L270 40 L260 130 L140 130 Z" fill="#2244aa" opacity="0.3" stroke="#4466cc" stroke-width="1.5"/>
  <!-- Cuello botella -->
  <rect x="170" y="130" width="60" height="20" rx="5" fill="#2244aa" opacity="0.3" stroke="#4466cc" stroke-width="1.5"/>
  <!-- Agua sucia en botella -->
  <path d="M140 80 L260 80 L255 130 L145 130 Z" fill="#6b4c2a" opacity="0.4"/>
  <text x="200" y="68" text-anchor="middle" fill="#cc9966" font-size="10">agua sucia</text>
  <!-- Flechas agua cayendo -->
  <line x1="200" y1="150" x2="200" y2="162" stroke="#4af" stroke-width="2" marker-end="url(#aw)"/>
  <defs>
    <marker id="aw" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4af"/>
    </marker>
  </defs>

  <!-- Recipiente inferior (filtro) -->
  <rect x="125" y="162" width="150" height="98" rx="8" fill="#1a1a3a" stroke="#444" stroke-width="1.5"/>

  <!-- CAPAS del filtro -->
  <!-- Capa 1: Tela superior -->
  <rect x="125" y="162" width="150" height="14" rx="4" fill="#8b6b3a" opacity="0.8"/>
  <text x="285" y="173" fill="#cc9966" font-size="9" font-weight="bold">① Tela algodón</text>
  <!-- Líneas de tela -->
  <line x1="135" y1="166" x2="265" y2="166" stroke="#aa8850" stroke-width="0.8"/>
  <line x1="135" y1="170" x2="265" y2="170" stroke="#aa8850" stroke-width="0.8"/>

  <!-- Capa 2: Arena -->
  <rect x="125" y="176" width="150" height="30" fill="#c8a870" opacity="0.7"/>
  <text x="285" y="194" fill="#ddb870" font-size="9" font-weight="bold">② Arena fina</text>
  <!-- Textura arena -->
  <circle cx="145" cy="186" r="2" fill="#aa8840" opacity="0.6"/>
  <circle cx="155" cy="190" r="1.5" fill="#aa8840" opacity="0.6"/>
  <circle cx="165" cy="184" r="2" fill="#aa8840" opacity="0.6"/>
  <circle cx="175" cy="189" r="1.5" fill="#aa8840" opacity="0.6"/>
  <circle cx="185" cy="185" r="2" fill="#aa8840" opacity="0.6"/>
  <circle cx="200" cy="191" r="1.5" fill="#aa8840" opacity="0.6"/>
  <circle cx="215" cy="184" r="2" fill="#aa8840" opacity="0.6"/>
  <circle cx="230" cy="188" r="1.5" fill="#aa8840" opacity="0.6"/>
  <circle cx="245" cy="185" r="2" fill="#aa8840" opacity="0.6"/>

  <!-- Capa 3: Carbón -->
  <rect x="125" y="206" width="150" height="28" fill="#333" opacity="0.9"/>
  <text x="285" y="223" fill="#aaa" font-size="9" font-weight="bold">③ Carbón vegetal</text>
  <!-- Textura carbón -->
  <circle cx="140" cy="215" r="3" fill="#222" opacity="0.8"/>
  <circle cx="152" cy="220" r="2.5" fill="#222" opacity="0.8"/>
  <circle cx="163" cy="213" r="3" fill="#222" opacity="0.8"/>
  <circle cx="176" cy="218" r="2.5" fill="#222" opacity="0.8"/>
  <circle cx="188" cy="214" r="3" fill="#222" opacity="0.8"/>
  <circle cx="200" cy="220" r="2.5" fill="#222" opacity="0.8"/>
  <circle cx="212" cy="215" r="3" fill="#222" opacity="0.8"/>
  <circle cx="224" cy="219" r="2.5" fill="#222" opacity="0.8"/>
  <circle cx="236" cy="213" r="3" fill="#222" opacity="0.8"/>
  <circle cx="248" cy="218" r="2.5" fill="#222" opacity="0.8"/>

  <!-- Capa 4: Tela inferior -->
  <rect x="125" y="234" width="150" height="14" rx="0" fill="#8b6b3a" opacity="0.8"/>
  <text x="285" y="244" fill="#cc9966" font-size="9" font-weight="bold">④ Tela algodón</text>
  <line x1="135" y1="238" x2="265" y2="238" stroke="#aa8850" stroke-width="0.8"/>
  <line x1="135" y1="242" x2="265" y2="242" stroke="#aa8850" stroke-width="0.8"/>

  <!-- Agua filtrada abajo -->
  <rect x="125" y="248" width="150" height="12" rx="0" fill="#1a6aaa" opacity="0.5"/>
  <text x="200" y="258" text-anchor="middle" fill="#66aaff" font-size="9">agua filtrada</text>

  <!-- Nota importante -->
  <rect x="20" y="248" width="100" height="28" rx="6" fill="#2a1a00" stroke="#FF6B2B" stroke-width="1"/>
  <text x="70" y="261" text-anchor="middle" fill="#FF6B2B" font-size="8" font-weight="bold">⚠️ Siempre</text>
  <text x="70" y="272" text-anchor="middle" fill="#FF6B2B" font-size="8" font-weight="bold">+ lavandina</text>
</svg>
